<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 675" role="img" aria-labelledby="title desc">
  <title id="title">Toy building blocks</title>
  <desc id="desc">Colorful construction blocks for a children's toy shop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset=".5" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#dcfce7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1e3a8a" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="900" height="675" fill="url(#bg)"/>
  <circle cx="130" cy="140" r="58" fill="#ef4444" opacity=".2"/>
  <circle cx="760" cy="155" r="86" fill="#22c55e" opacity=".18"/>
  <circle cx="700" cy="545" r="120" fill="#f59e0b" opacity=".18"/>
  <g filter="url(#shadow)">
